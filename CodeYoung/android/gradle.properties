org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# The pub cache lives on C: while this project lives on D:, and Kotlin's
# RelocatableFileToPathConverter cannot compute a relative path across drive
# roots. It throws "this and base files have different roots" while flushing
# incremental caches, failing every plugin's compileDebugKotlin. Trade a little
# build speed for correctness.
kotlin.incremental=false
